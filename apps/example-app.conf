# 一个应用一个 .conf 文件。复制改名，按盘点结果填。
# 留空的项会被跳过。多个路径用空格分隔（路径本身不要含空格）。

# 应用程序本体目录（如 /opt/xxx、/usr/local/xxx）
BIN_DIRS="/opt/example"

# 应用专属配置目录（只填这个应用自己的，绝不要填 /etc 整个！）
CONF_DIRS="/etc/example"

# 数据目录：上传文件、缓存、非数据库的持久化数据
DATA_DIRS="/opt/example/uploads /var/lib/example"

# systemd unit 文件名（位于 /etc/systemd/system/ 或 /lib/systemd/system/）
UNIT_FILES="example.service"

# 定时任务文件（/etc/cron.d/ 下的）
CRON_FILES="/etc/cron.d/example"

# 环境变量文件（常被遗漏，应用起不来多半因为它）
ENV_FILES="/opt/example/.env"

# 要迁移的 MySQL 数据库名（空格分隔多个）
MYSQL_DBS="exampledb"

# 要迁移的 Postgres 数据库名
PG_DBS=""

# 该应用占用的端口（仅用于冲突排查记录）
PORTS="8080"
